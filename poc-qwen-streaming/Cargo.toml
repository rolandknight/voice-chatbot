[package]
name = "poc-qwen-streaming"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust server embedding poc-qwen's mlx-audio engine via PyO3; streams Qwen3-TTS to the browser over WebSocket"

[[bin]]
name = "poc-qwen-streaming"
path = "src/main.rs"

[dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
numpy = "0.29"
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures = "0.3"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
