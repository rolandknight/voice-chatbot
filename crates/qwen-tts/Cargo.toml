[package]
name = "qwen-tts"
version = "0.1.0"
edition = "2021"
publish = false
description = "PyO3-embedded mlx-audio Qwen3-TTS engine with a streaming PCM channel"

[lib]
name = "qwen_tts"
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
numpy = "0.29"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
anyhow = "1"
futures = "0.3"
hound = "3.5"
