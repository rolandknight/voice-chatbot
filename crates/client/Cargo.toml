[package]
name = "voice-chatbot-client"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
audioadapter-buffers = "=4.0.0"
audiopus = "0.2"
clap = { version = "4", features = ["derive", "env"] }
cpal = "=0.18.2"
futures = "0.3"
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev", "macos-shared-device"] }
hidreport = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rubato = { version = "=4.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "=0.21.0", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
voice-chatbot-env-file = { path = "../env-file" }
voice-chatbot-protocol = { path = "../protocol" }
voice-chatbot-wake = { path = "../wake" }
voice-chatbot-ws2812 = { path = "../ws2812" }

[dev-dependencies]
pretty_assertions = "1"
