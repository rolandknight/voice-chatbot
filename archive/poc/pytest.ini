[pytest]
markers =
    smoke: fast end-to-end smoke tests (T1, T2)
    tools: tool-selection tests (T3, T4)
    duplex: full-duplex barge-in tests (T5); requires the duplex server build
    concurrency: concurrent-session tests (T6)
    teardown: abrupt-teardown tests (T7)
    lifecycle: idle-lifecycle tests (T8)
    inflight: in-flight tool-latency tests (T9)
    latency: latency bench (T10)
    failures: tool-failure surfacing tests (T11)
    soak: soak tests (T12)
    wake: server-side wake-word tests (T13); requires POC_WAKE_MODEL stack
    voice: cloned-voice TTS tests (T14); requires POC_TTS_BACKEND=chatterbox stack
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
