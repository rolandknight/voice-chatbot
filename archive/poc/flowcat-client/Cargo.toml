[package]
name = "flowcat-webrtc-client"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
audioadapter-buffers = "=4.0.0"
audiopus = "0.2"
clap = { version = "4", features = ["derive", "env"] }
cpal = "=0.18.2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rubato = { version = "=4.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "=0.21.0", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
pretty_assertions = "1"
